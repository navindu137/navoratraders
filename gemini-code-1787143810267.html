<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aether — Elite Launch Sequence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg: #05050a;
      --surface: rgba(20, 20, 35, 0.45);
      --border: rgba(255, 255, 255, 0.07);
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.35);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Three.js Canvas Layer */
    #webgl-container {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    /* Vignette & Ambient Overlays */
    .overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, transparent 20%, rgba(5, 5, 10, 0.85) 90%);
      z-index: 2;
      pointer-events: none;
    }

    /* Main Glass Card */
    .wrapper {
      position: relative;
      z-index: 3;
      max-width: 760px;
      width: 90%;
      background: var(--surface);
      border: 1px solid var(--border);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 32px;
      padding: 3.5rem 2.5rem;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      opacity: 0;
      transform: translateY(30px);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 1rem;
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.25);
      border-radius: 99px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #818cf8;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 2rem;
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      background: #818cf8;
      border-radius: 50%;
      box-shadow: 0 0 10px #818cf8;
      animation: pulse 2s infinite;
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(2.5rem, 5vw, 3.75rem);
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.03em;
      margin-bottom: 1.25rem;
    }

    .gradient-text {
      background: linear-gradient(135deg, #ffffff 30%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 1.05rem;
      line-height: 1.7;
      max-width: 520px;
      margin: 0 auto 3rem;
    }

    /* Sleek Countdown Grid */
    .countdown-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      margin-bottom: 3rem;
    }

    .time-box {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      padding: 1.5rem 0.5rem;
      position: relative;
      overflow: hidden;
    }

    .time-box::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.4;
    }

    .time-value {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(2rem, 4vw, 2.75rem);
      font-weight: 700;
      color: var(--text-main);
      display: block;
      line-height: 1;
      margin-bottom: 0.4rem;
    }

    .time-label {
      font-size: 0.725rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* Subscription Form */
    .form-container {
      max-width: 440px;
      margin: 0 auto;
    }

    .input-group {
      display: flex;
      background: rgba(10, 10, 20, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 0.35rem;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .input-group:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-glow);
    }

    .input-group input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      padding: 0.75rem 1rem;
      color: var(--text-main);
      font-size: 0.95rem;
      font-family: inherit;
    }

    .input-group input::placeholder {
      color: #64748b;
    }

    .input-group button {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.925rem;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .input-group button:hover {
      filter: brightness(1.15);
      transform: translateY(-1px);
    }

    .success-msg {
      margin-top: 1rem;
      font-size: 0.875rem;
      color: #34d399;
      display: none;
      font-weight: 500;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    @media (max-width: 640px) {
      .countdown-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .wrapper {
        padding: 2.5rem 1.5rem;
      }
    }
  </style>
</head>
<body>

  <div id="webgl-container"></div>
  <div class="overlay"></div>

  <main class="wrapper" id="mainCard">
    <div class="badge">
      <div class="pulse-dot"></div>
      <span>System Deployment Initializing</span>
    </div>
    
    <h1>Engineering the future <br><span class="gradient-text">of digital interaction.</span></h1>
    <p class="subtitle">Aether is approaching its final development milestone. Secure your priority access credentials below.</p>

    <!-- 30-Day Countdown Engine -->
    <div class="countdown-grid">
      <div class="time-box">
        <span class="time-value" id="days">30</span>
        <span class="time-label">Days</span>
      </div>
      <div class="time-box">
        <span class="time-value" id="hours">00</span>
        <span class="time-label">Hours</span>
      </div>
      <div class="time-box">
        <span class="time-value" id="minutes">00</span>
        <span class="time-label">Minutes</span>
      </div>
      <div class="time-box">
        <span class="time-value" id="seconds">00</span>
        <span class="time-label">Seconds</span>
      </div>
    </div>

    <div class="form-container">
      <form class="input-group" id="notifyForm">
        <input type="email" placeholder="Enter your professional email" required />
        <button type="submit">Request Access</button>
      </form>
      <div class="success-msg" id="successMsg">Priority token registered. Welcome aboard.</div>
    </div>
  </main>

  <script>
    // 1. Professional Entrance Animation via GSAP
    window.addEventListener('DOMContentLoaded', () => {
      gsap.to("#mainCard", {
        opacity: 1,
        y: 0,
        duration: 1.2,
        ease: "power3.out"
      });
    });

    // 2. High-End Three.js 3D Interactive Torus Knot Particle Field Background
    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 35;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // Create Geometry & Mesh
    const geometry = new THREE.TorusKnotGeometry(10, 3, 128, 32);
    const material = new THREE.PointsMaterial({
      size: 0.12,
      color: 0x818cf8,
      transparent: true,
      opacity: 0.7,
      blending: THREE.AdditiveBlending
    });

    const torusKnot = new THREE.Points(geometry, material);
    scene.add(torusKnot);

    // Mouse Tracking Parallax
    let mouseX = 0, mouseY = 0;
    let targetX = 0, targetY = 0;

    window.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX - window.innerWidth / 2) * 0.001;
      mouseY = (e.clientY - window.innerHeight / 2) * 0.001;
    });

    // Render Loop
    function animate() {
      requestAnimationFrame(animate);

      targetX += (mouseX - targetX) * 0.05;
      targetY += (mouseY - targetY) * 0.05;

      torusKnot.rotation.x += 0.002 + targetY;
      torusKnot.rotation.y += 0.003 + targetX;

      renderer.render(scene, camera);
    }
    animate();

    // Responsive Window Scaling
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 3. 30-Day Countdown Logic
    const targetDate = new Date().getTime() + (30 * 24 * 60 * 60 * 1000);
    const daysEl = document.getElementById('days');
    const hoursEl = document.getElementById('hours');
    const minutesEl = document.getElementById('minutes');
    const secondsEl = document.getElementById('seconds');

    function pad(n) {
      return n < 10 ? `0${n}` : n;
    }

    function updateTimer() {
      const now = new Date().getTime();
      const diff = targetDate - now;

      if (diff <= 0) {
        clearInterval(timerInterval);
        return;
      }

      daysEl.textContent = pad(Math.floor(diff / (1000 * 60 * 60 * 24)));
      hoursEl.textContent = pad(Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)));
      minutesEl.textContent = pad(Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60)));
      secondsEl.textContent = pad(Math.floor((diff % (1000 * 60)) / 1000));
    }

    const timerInterval = setInterval(updateTimer, 1000);
    updateTimer();

    // 4. Form Action & Confetti Burst
    document.getElementById('notifyForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      btn.textContent = "Secured";
      btn.style.background = "#10b981";
      document.getElementById('successMsg').style.display = 'block';

      if (typeof confetti === 'function') {
        confetti({
          particleCount: 120,
          spread: 80,
          origin: { y: 0.65 },
          colors: ['#6366f1', '#34d399', '#a855f7']
        });
      }
    });
  </script>
</body>
</html>
