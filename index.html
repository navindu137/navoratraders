<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Navora Traders - Page Not Found">
  <title>404 - Page Not Found | Navora Traders</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Ambient background glow matching index.html -->
  <div class="background">
    <div class="orb orb-one"></div>
    <div class="orb orb-two"></div>
  </div>

  <main class="container">

    <nav>
      <a href="index.html" class="logo">
        <span class="logo-icon">N</span>
        <span>Navora <b>Traders</b></span>
      </a>

      <span class="badge">ERROR 404</span>
    </nav>

    <section class="hero">

      <div class="eyebrow">404 ERROR</div>

      <h1>
        Lost in <span>space.</span>
      </h1>

      <p class="description">
        The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
      </p>

      <div class="buttons">
        <a href="index.html" class="btn primary">
          Back to Home
        </a>
        <a href="mailto:info@navoratraders.com" class="btn secondary">
          Report Issue
        </a>
      </div>

    </section>

    <footer>
      <p>© <span id="year"></span> Navora Traders. All rights reserved.</p>
      <p>Status: Page not found</p>
    </footer>

  </main>

  <script>
    const yearEl = document.getElementById("year");
    if (yearEl) {
      yearEl.textContent = new Date().getFullYear();
    }
  </script>
</body>
</html>
